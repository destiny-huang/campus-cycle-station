server {
    listen 80;
    listen [::]:80;
    server_name cycle.bdfzscc.com;

    return 301 https://cycle.bdfzscc.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cycle.bdfzscc.com;

    ssl_certificate /etc/nginx/ssl/cycle.bdfzscc.com/cycle.bdfzscc.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/cycle.bdfzscc.com/cycle.bdfzscc.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusCycleSSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:9350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }
}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174b3b" />
    <title>校园循环站 · 暂时离线</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf8ee;color:#183f34;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}.offline{width:min(520px,100%);padding:34px;border:4px solid #80502d;background:#fffaf0;box-shadow:9px 10px 0 #e0ceb0}.mark{display:grid;width:54px;height:54px;place-items:center;background:#167052;color:#fff;font-size:25px;font-weight:800}.offline h1{margin:22px 0 12px;font-size:31px}.offline p{color:#60756b;line-height:1.8}.offline button{min-height:42px;padding:9px 18px;border:1px solid #155d47;background:#176b50;color:#fff;font:700 15px inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="offline">
      <span class="mark">循</span>
      <h1>网络暂时没有连接</h1>
      <p>校园循环站不会离线保存账号、积分或物品数据。连接网络后即可继续登录、捐赠和领取。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
